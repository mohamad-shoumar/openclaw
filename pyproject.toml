[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openclaw-jobsearch"
version = "0.1.0"
description = "Strict-mode local job discovery pipeline for OpenClaw."
readme = "boot.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.11,<3",
]

[project.scripts]
openclaw-jobs = "openclaw_jobsearch.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
